[package]
name = "proofme-attestations"
description = "Atesta attestations as non-transferable, revocable NEP-171 NFTs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
